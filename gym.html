<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard Loading Skeleton</title>
  <style>
    /* --- Your Original CSS --- */
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #060606;
      font-family: Arial, sans-serif;
    }

    .dashboard {
      display: flex;
      min-height: 100vh;
      background: #060606;
      color: white;
    }

    .sidebar {
      width: 260px;
      background: #0f0f0f;
      padding: 25px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      border-right: 1px solid rgba(255, 255, 255, 0.08);
    }

    .sidebar-menu {
      margin-top: 40px;
      flex: 1;
    }

    .main-content {
      flex: 1;
      padding: 25px;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .topbar-right {
      display: flex;
      gap: 15px;
    }

    .stats-grid {
      margin-top: 30px;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 20px;
    }

    .card {
      background: #101010;
      padding: 24px;
      border-radius: 24px;
      border: 1px solid rgba(255, 255, 255, 0.06);
    }

    .charts-grid {
      margin-top: 30px;
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 20px;
    }

    .chart-card,
    .session-card {
      background: #101010;
      padding: 24px;
      border-radius: 24px;
      border: 1px solid rgba(255, 255, 255, 0.06);
    }

    .session-card {
      margin-top: 30px;
    }

    .session-row {
      display: flex;
      gap: 18px;
      align-items: center;
      margin-top: 25px;
    }

    .shimmer {
      position: relative;
      overflow: hidden;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 16px; /* Transferred from React inline styles */
    }

    .shimmer::after {
      content: "";
      position: absolute;
      top: 0;
      left: -120%;
      width: 100%;
      height: 100%;
      background: linear-gradient(
        90deg,
        transparent,
        rgba(204, 255, 0, 0.25),
        transparent
      );
      animation: shimmer 1.5s infinite;
    }

    @keyframes shimmer {
      100% {
        left: 120%;
      }
    }

    @media (max-width: 1100px) {
      .stats-grid {
        grid-template-columns: repeat(2, 1fr);
      }

      .charts-grid {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 768px) {
      .dashboard {
        flex-direction: column;
      }

      .sidebar {
        width: 100%;
      }

      .stats-grid {
        grid-template-columns: 1fr;
      }

      .topbar {
        flex-direction: column;
        gap: 20px;
        align-items: flex-start;
      }
    }
  </style>
</head>
<body>

  <div class="dashboard">
    
    <aside class="sidebar">
